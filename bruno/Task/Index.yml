info:
  name: Index
  type: http
  seq: 1

http:
  method: GET
  url: "{{process.env.APP_URL}}/api/tasks?filter[description]=description&sort=-title"
  params:
    - name: filter[description]
      value: description
      type: query
    - name: sort
      value: -title
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
